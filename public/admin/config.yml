# Decap CMS configuration — scoped to THIS repository only.
# Edits made in the /admin panel are committed straight to the main branch,
# which triggers the GitHub Pages deploy and updates the live site.
backend:
  name: github
  repo: ahmedbadway/Mohsen
  branch: main
  # OAuth gateway for this repo (Cloudflare Worker). See oauth-worker/README.md.
  base_url: https://hosni-cms-auth.ggtxk9bkbf.workers.dev

# Uploaded images land here in the repo and are referenced from the site root.
media_folder: public/assets/images
public_folder: /assets/images

# Interface language for the panel.
locale: en

collections:
  - name: content
    label: Website Content
    files:
      - name: projects
        label: Projects
        file: public/content/projects.json
        # Preview is disabled because the site renders these itself.
        editor:
          preview: false
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: slug, label: 'ID (do not change)', widget: string, hint: 'Unique folder id, e.g. project-01' }
              - { name: title, label: 'Title (shown on cover)', widget: string }
              - { name: category, label: Category, widget: string }
              - { name: year, label: Year, widget: string }
              - { name: details, label: Description, widget: text }
              - { name: cover, label: Cover image, widget: image, choose_url: false }
              - name: gallery
                label: Album images
                widget: list
                field: { name: image, label: Image, widget: image, choose_url: false }
              - name: video
                label: Video
                widget: file
                required: false
                media_folder: /public/assets/videos
                public_folder: /assets/videos
