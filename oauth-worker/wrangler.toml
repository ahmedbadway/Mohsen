# Cloudflare Worker config for the Decap CMS OAuth gateway.
# Only needed if you deploy with the Wrangler CLI. If you paste the code into
# the Cloudflare dashboard instead, you don't need this file — just set the two
# environment variables (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET) in the UI.

name = "hosni-cms-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Do NOT put secrets here. Set them once with:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
